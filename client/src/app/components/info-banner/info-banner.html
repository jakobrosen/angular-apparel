<section class="border-t border-gray-200 py-10 bg-bg-1 flex justify-evenly">
  <ul
    class="mx-auto w-full max-w-350 grid grid-cols-1 gap-6 px-4 font-sans sm:grid-cols-2 lg:grid-cols-4 lg:px-8"
  >
    @for (item of items; track item.icon) {
      <li class="flex items-center gap-3">
        <ng-icon [name]="item.icon" class="shrink-0 text-4xl text-gray-950"></ng-icon>
        <span class="text-sm text-gray-700">{{ item.label }}</span>
      </li>
    }
  </ul>
</section>
