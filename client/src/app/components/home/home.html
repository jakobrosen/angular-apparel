<section class="relative h-[70vh] w-full overflow-hidden bg-gray-950 sm:h-[80vh]">
  <img
    ngSrc="images/hero.png"
    fill
    priority
    class="object-cover object-top"
    alt="Two people in oversized black and grey hoodies and sweatpants sitting on a concrete rooftop at sunrise, overlooking the city"
  />

  <div class="absolute inset-0 bg-linear-to-t from-black/80 via-black/10 to-transparent"></div>

  <div class="absolute inset-x-0 bottom-0 px-4 pb-10 sm:pb-14 text-shadow-sm text-shadow-text">
    <div class="max-w-md sm:max-w-lg">
      <h1
        class="hero-title font-sans font-semibold text-5xl leading-tight text-white sm:text-6xl lg:text-7xl"
      >
        SUMMER SALE
      </h1>
      <p class="mt-2 hero-subtext max-w-sm font-sans text-sm text-white/80 sm:text-lg">
        Up to 50% off on selected pieces.
      </p>
      <a
        routerLink="/all"
        class="hero-cta mt-6 inline-block border border-white px-6 py-2.5 font-sans text-sm font-semibold text-white transition-colors hover:bg-white hover:text-gray-950"
      >
        Shop the collection
      </a>
    </div>
  </div>
</section>

<section class="px-4 py-10 sm:py-14">
  <div class="grid grid-cols-2 gap-x-4 gap-y-8 sm:grid-cols-3 lg:grid-cols-4">
    @for (product of products(); track product.title) {
      <app-product-card [product]="product" />
    }
  </div>
</section>
