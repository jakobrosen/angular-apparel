<div class="flex h-full flex-col font-sans">
  <!-- Header -->
  <div class="flex items-center justify-between border-b border-gray-200 p-4">
    <h2 class="text-lg font-semibold">Your Cart</h2>

    <!-- Close cart icon -->
    <ng-icon
      name="phosphorX"
      class="text-gray-700 hover:text-gray-950 transition-colors text-2xl cursor-pointer"
      (click)="close.emit()"
    ></ng-icon>
  </div>

  @if (cartService.isEmpty()) {
    <p class="p-4 text-gray-500">Your cart is empty.</p>
  } @else {
    <!-- Raderna, det enda som scrollar -->
    <ul class="flex-1 space-y-3 overflow-y-auto p-4">
      @for (item of cartService.items(); track item.product.id) {
        <li>
          <app-cart-product-card
            [product]="item.product"
            [quantity]="item.quantity"
            (quantityChange)="cartService.setQuantity(item.product.id, $event)"
            (remove)="cartService.remove(item.product.id)"
          />
        </li>
      }
    </ul>

    <!-- Summering -->
    <div class="border-t border-gray-200 p-4">
      <p class="flex items-baseline justify-between">
        <span class="text-sm text-gray-700">Subtotal</span>
        <span class="text-lg font-semibold text-gray-950">
          {{ cartService.subtotal() | currency: 'USD' : 'symbol' : '1.0-2' }}
        </span>
      </p>

      <a
        routerLink="/checkout"
        class="mt-4 block w-full bg-gray-950 px-6 py-3 text-center text-sm font-semibold text-white transition-colors hover:bg-gray-800"
        (click)="close.emit()"
      >
        Checkout
      </a>

      <button
        type="button"
        class="mt-2 w-full cursor-pointer px-6 py-2 text-sm text-gray-500 transition-colors hover:text-gray-950"
        (click)="cartService.clear()"
      >
        Clear cart
      </button>
    </div>
  }
</div>
