<div
  [attr.inert]="open() ? null : ''"
  [class]="open() ? 'translate-y-0' : '-translate-y-full'"
  class="hidden lg:block fixed inset-x-0 z-10 top-14 border-t shadow-sm border-gray-200 bg-white transition-transform duration-300"
>
  <div
    class="border-b border-gray-200 py-3 text-center font-sans text-lg font-semibold text-gray-950"
  >
    {{ heading() }}
  </div>
  <div class="flex justify-center">
    <!-- En kolumn per kolumn i sektionen, från MenuService. -->
    <div class="flex justify-around p-5 w-220">
      @for (column of section()?.columns; track column.heading) {
        <app-menu-column [column]="column" (linkClicked)="linkClicked.emit()" />
      }
    </div>
  </div>
</div>
