<div class="sticky top-0 z-50" (mouseleave)="closeHoverMenu()">
  <header class="bg-white shadow-sm relative z-20">
    <div class="mx-auto px-4 py-3 h-14">
      <div class="flex justify-between items-center select-none">
        <!-- Logo -->
        <div class="w-41 flex items-center">
          <a
            routerLink="/"
            class="hidden lg:flex text-2xl font-logo text-gray-950 whitespace-nowrap"
          >
            ANGULAR APPAREL
          </a>

          <!-- Menu icon -->
          <div class="flex items-center mr-1.5 lg:hidden">
            <button
              type="button"
              aria-controls="mobile-menu"
              [attr.aria-expanded]="mobileMenuIsOpen()"
              [attr.aria-label]="mobileMenuIsOpen() ? 'Close menu' : 'Open menu'"
              class="flex items-center cursor-pointer"
              (click)="toggleMobileMenu()"
            >
              <ng-icon
                [name]="mobileMenuIsOpen() ? 'phosphorX' : 'phosphorList'"
                class="text-gray-700 hover:text-gray-950 transition-colors text-2xl"
              ></ng-icon>
            </button>
          </div>
        </div>

        <!-- Desktop navigation -->
        <nav aria-label="Main" class="hidden lg:block">
          <ul
            class="flex text-sm font-sans font-semibold whitespace-nowrap items-center justify-center space-x-8"
          >
            <li>
              <a
                routerLink="/products"
                [queryParams]="{ sort: 'newest' }"
                routerLinkActive="text-blue-600 font-sans"
                [routerLinkActiveOptions]="{ exact: false }"
                class="text-gray-700 hover:text-gray-950 transition-colors"
                (mouseenter)="openHoverMenu('NEW ARRIVALS')"
              >
                NEW ARRIVALS
              </a>
            </li>
            <li>
              <a
                routerLink="/products"
                routerLinkActive="text-blue-600 font-semibold"
                [routerLinkActiveOptions]="{ exact: false }"
                class="text-gray-700 hover:text-gray-950 transition-colors"
                (mouseenter)="openHoverMenu('ALL PRODUCTS')"
              >
                ALL PRODUCTS
              </a>
            </li>
            <li>
              <a
                routerLink="/products/women"
                routerLinkActive="text-blue-600 font-semibold"
                [routerLinkActiveOptions]="{ exact: false }"
                class="text-gray-700 hover:text-gray-950 transition-colors"
                (mouseenter)="openHoverMenu('WOMEN')"
              >
                WOMEN
              </a>
            </li>
            <li>
              <a
                routerLink="/products/men"
                routerLinkActive="text-blue-600 font-semibold"
                [routerLinkActiveOptions]="{ exact: false }"
                class="text-gray-700 hover:text-gray-950 transition-colors"
                (mouseenter)="openHoverMenu('MEN')"
              >
                MEN
              </a>
            </li>
          </ul>
        </nav>
        <a routerLink="/" class="flex lg:hidden text-2xl font-logo text-gray-950 whitespace-nowrap">
          ANGULAR APPAREL
        </a>

        <!-- Right side icons -->
        <div class="w-41 flex justify-end items-center space-x-4 text-2xl ml-1.5">
          <!-- Search icon -->
          <button type="button" aria-label="Search" class="flex items-center cursor-pointer">
            <ng-icon
              name="phosphorMagnifyingGlass"
              class="text-gray-700 hover:text-gray-950 transition-colors text-2xl"
            ></ng-icon>
          </button>

          <!-- Cart icon -->
          <button
            type="button"
            aria-label="Open cart"
            aria-controls="cart-panel"
            [attr.aria-expanded]="cartIsOpen()"
            class="flex items-center cursor-pointer"
            (click)="toggleCart()"
          >
            <ng-icon
              name="phosphorBag"
              class="text-gray-700 hover:text-gray-950 transition-colors text-2xl"
            ></ng-icon>
          </button>
        </div>
      </div>
    </div>
  </header>

  <app-hover-menu [isOpen]="hoverMenuIsOpen()" [heading]="hoverMenuHeading()" />
</div>

<!-- Mobile navigation menu -->
<app-mobile-menu [isOpen]="mobileMenuIsOpen()" />

<!-- Cart slide-in panel -->
<div
  id="cart-panel"
  role="dialog"
  aria-modal="true"
  aria-label="Shopping cart"
  [attr.inert]="cartIsOpen() ? null : ''"
  [class]="cartIsOpen() ? 'translate-x-0' : 'translate-x-full'"
  class="fixed top-0 right-0 z-60 h-full w-full max-w-sm bg-white shadow-lg transition-transform duration-300"
>
  <app-cart (close)="toggleCart()" />
</div>

<!-- Menu background -->
<div
  aria-hidden="true"
  [class]="mobileMenuIsOpen() ? 'opacity-50 pointer-events-auto' : 'opacity-0 pointer-events-none'"
  class="bg-black w-full h-full top-0 left-0 fixed transition-opacity duration-300 lg:hidden z-10"
  (click)="closeAllMenus()"
></div>

<!-- Hover menu background -->
<div
  aria-hidden="true"
  [class]="hoverMenuIsOpen() ? 'opacity-50 pointer-events-auto' : 'opacity-0 pointer-events-none'"
  class="bg-black w-full h-full top-0 left-0 hidden lg:block fixed transition-opacity duration-300 z-30"
  (click)="closeAllMenus()"
></div>

<!-- Cart background -->
<div
  aria-hidden="true"
  [class]="cartIsOpen() ? 'opacity-50 pointer-events-auto' : 'opacity-0 pointer-events-none'"
  class="bg-black w-full h-full top-0 left-0 z-55 fixed transition-opacity duration-300"
  (click)="closeAllMenus()"
></div>
