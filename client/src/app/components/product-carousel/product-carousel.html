@if (!products().error()) {
  <section class="mx-auto w-full max-w-350 px-4 font-sans lg:px-8">
    <div class="flex items-center justify-between gap-4">
      @if (heading()) {
        <h2 class="text-lg font-semibold text-gray-950">{{ heading() }}</h2>
      }

      <div class="ml-auto hidden gap-2 sm:flex">
        <button
          type="button"
          aria-label="Scroll left"
          class="flex cursor-pointer items-center border border-gray-950 p-2 text-lg text-gray-950 transition-colors hover:bg-gray-950 hover:text-white"
          (click)="scroll(-1)"
        >
          <ng-icon name="phosphorCaretLeft"></ng-icon>
        </button>
        <button
          type="button"
          aria-label="Scroll right"
          class="flex cursor-pointer items-center border border-gray-950 p-2 text-lg text-gray-950 transition-colors hover:bg-gray-950 hover:text-white"
          (click)="scroll(1)"
        >
          <ng-icon name="phosphorCaretRight"></ng-icon>
        </button>
      </div>
    </div>

    <div
      #track
      [attr.aria-busy]="products().isLoading()"
      class="carousel-track mt-4 -mx-1.5 flex snap-x snap-mandatory overflow-x-auto scroll-smooth pb-2"
    >
      @if (products().isLoading()) {
        @for (skeleton of skeletons; track $index) {
          <div class="shrink-0 basis-full px-1.5 sm:basis-1/2 lg:basis-1/3">
            <div class="animate-pulse">
              <div class="aspect-square bg-gray-200"></div>
              <div class="mt-3 px-3">
                <div class="h-4 w-16 bg-gray-200"></div>
                <div class="mt-2 h-3 w-3/4 bg-gray-200"></div>
                <div class="mt-2 h-3 w-1/3 bg-gray-200"></div>
              </div>
            </div>
          </div>
        }
      } @else {
        @for (product of items(); track product.id) {
          <div class="shrink-0 basis-full snap-start px-1.5 sm:basis-1/2 lg:basis-1/3">
            <app-product-card [product]="product" [eager]="$index < 3" />
          </div>
        }
      }
    </div>
  </section>
}
