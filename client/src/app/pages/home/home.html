<app-hero
  header="FALL SALE"
  subHeader="Up to 50% discount on selected items."
  buttonText="SHOP THE SALE"
  [buttonParams]="{ discount: true }"
/>
<section class="py-8">
  <h2 class="mx-auto mb-8 max-w-350 px-4 font-sans text-4xl font-bold text-text lg:px-8">
    LATEST DROPS
  </h2>

  <!-- Samma grid som produktsidan, men med startsidans resurs och utan sidbrytning. -->
  <app-product-grid [products]="productService.latestProducts" [paginated]="false" />
</section>
