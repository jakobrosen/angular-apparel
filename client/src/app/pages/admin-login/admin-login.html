<section class="mx-auto w-full max-w-sm px-4 py-10 font-sans lg:px-8">
  <h1 class="text-2xl font-semibold text-gray-950">Admin login</h1>

  <form #form class="mt-6 flex flex-col gap-4" (submit)="submit($event, form)">
    <div>
      <label for="username" class="block text-sm font-semibold text-gray-950">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        required
        class="mt-1 w-full border border-gray-300 bg-bg-1 px-3 py-2.5 text-sm text-gray-950 transition-colors focus:border-gray-950 focus:outline-none"
      />
    </div>

    <div>
      <label for="password" class="block text-sm font-semibold text-gray-950">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        class="mt-1 w-full border border-gray-300 bg-bg-1 px-3 py-2.5 text-sm text-gray-950 transition-colors focus:border-gray-950 focus:outline-none"
      />
    </div>

    @if (error()) {
      <p role="alert" class="text-sm text-red-700">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="submitting()"
      class="mt-2 cursor-pointer bg-gray-950 px-6 py-3 text-sm font-semibold text-white transition-colors hover:bg-gray-800 disabled:cursor-not-allowed disabled:bg-gray-300"
    >
      {{ submitting() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>
</section>
