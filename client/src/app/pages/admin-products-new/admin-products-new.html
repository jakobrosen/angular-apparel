<section class="mx-auto w-full max-w-2xl px-4 py-10 font-sans lg:px-8">
  <div class="flex flex-wrap items-baseline justify-between gap-3">
    <h1 class="text-2xl font-semibold text-gray-950">New product</h1>
    <a
      routerLink="/admin/products"
      class="text-sm text-gray-700 underline transition-colors hover:text-gray-950"
    >
      Back to products
    </a>
  </div>

  <form #form class="mt-6 flex flex-col gap-4" (submit)="submit($event, form)">
    <div>
      <label for="title" class="block text-sm font-semibold text-gray-950">Title</label>
      <input
        id="title"
        name="title"
        type="text"
        required
        class="mt-1 w-full border border-gray-300 bg-bg-1 px-3 py-2.5 text-sm text-gray-950 transition-colors focus:border-gray-950 focus:outline-none"
      />
    </div>

    <div>
      <label for="description" class="block text-sm font-semibold text-gray-950">Description</label>
      <textarea
        id="description"
        name="description"
        rows="3"
        required
        class="mt-1 w-full border border-gray-300 bg-bg-1 px-3 py-2.5 text-sm text-gray-950 transition-colors focus:border-gray-950 focus:outline-none"
      ></textarea>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <label for="sku" class="block text-sm font-semibold text-gray-950">SKU</label>
        <input
          id="sku"
          name="sku"
          type="text"
          required
          placeholder="ABC123"
          pattern="[A-Za-z]{3}[0-9]{3}"
          title="Three letters followed by three digits, for example ABC123"
          class="mt-1 w-full border border-gray-300 bg-bg-1 px-3 py-2.5 text-sm text-gray-950 uppercase transition-colors focus:border-gray-950 focus:outline-none"
        />
      </div>

      <div>
        <label for="gender" class="block text-sm font-semibold text-gray-950">Gender</label>
        <select
          id="gender"
          name="gender"
          required
          class="mt-1 w-full cursor-pointer border border-gray-300 bg-bg-1 px-3 py-2.5 text-sm text-gray-950 transition-colors focus:border-gray-950 focus:outline-none"
        >
          <option value="men">men</option>
          <option value="women">women</option>
        </select>
      </div>

      <div>
        <label for="price" class="block text-sm font-semibold text-gray-950">Price</label>
        <input
          id="price"
          name="price"
          type="number"
          min="0"
          step="0.01"
          required
          class="mt-1 w-full border border-gray-300 bg-bg-1 px-3 py-2.5 text-sm text-gray-950 transition-colors focus:border-gray-950 focus:outline-none"
        />
      </div>

      <div>
        <label for="prevPrice" class="block text-sm font-semibold text-gray-950">
          Previous price <span class="font-normal text-gray-500">(optional)</span>
        </label>
        <input
          id="prevPrice"
          name="prevPrice"
          type="number"
          min="0"
          step="0.01"
          class="mt-1 w-full border border-gray-300 bg-bg-1 px-3 py-2.5 text-sm text-gray-950 transition-colors focus:border-gray-950 focus:outline-none"
        />
      </div>

      <div>
        <label for="categoryId" class="block text-sm font-semibold text-gray-950">Category</label>
        <select
          id="categoryId"
          name="categoryId"
          required
          class="mt-1 w-full cursor-pointer border border-gray-300 bg-bg-1 px-3 py-2.5 text-sm text-gray-950 capitalize transition-colors focus:border-gray-950 focus:outline-none"
        >
          @for (category of categoryService.categories.value(); track category.id) {
            <option [value]="category.id">{{ category.name }}</option>
          }
        </select>
      </div>

      <div>
        <label for="brandId" class="block text-sm font-semibold text-gray-950">Brand</label>
        <select
          id="brandId"
          name="brandId"
          required
          class="mt-1 w-full cursor-pointer border border-gray-300 bg-bg-1 px-3 py-2.5 text-sm text-gray-950 capitalize transition-colors focus:border-gray-950 focus:outline-none"
        >
          @for (brand of brandService.brands.value(); track brand.id) {
            <option [value]="brand.id">{{ brand.name }}</option>
          }
        </select>
      </div>
    </div>

    <div>
      <label for="images" class="block text-sm font-semibold text-gray-950">
        Image URLs <span class="font-normal text-gray-500">(one per line, at least one)</span>
      </label>
      <textarea
        id="images"
        name="images"
        rows="4"
        required
        placeholder="https://example.com/front.jpg"
        class="mt-1 w-full border border-gray-300 bg-bg-1 px-3 py-2.5 text-sm text-gray-950 transition-colors focus:border-gray-950 focus:outline-none"
      ></textarea>
    </div>

    @if (error()) {
      <p role="alert" class="text-sm text-red-700">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="submitting()"
      class="mt-2 cursor-pointer bg-gray-950 px-6 py-3 text-sm font-semibold text-white transition-colors hover:bg-gray-800 disabled:cursor-not-allowed disabled:bg-gray-300"
    >
      {{ submitting() ? 'Creating…' : 'Create product' }}
    </button>
  </form>
</section>
